<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Flappy Roman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }
    canvas {
      border-radius: 20px;
      border: 2px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="game" width="420" height="640"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- физика ---
    const GRAVITY = 0.35;
    const JUMP = -7.8;

    const PIPE_WIDTH = 150; // ширина стен
    const GAP = 260;        // размер проёма

    // множители скорости / гравитации (для бонусов)
    let speedFactor = 1;
    let gravityFactor = 1;

    // --- игрок ---
    const playerImg = new Image();
    playerImg.src = "player.png";

    const player = {
      x: 90,
      y: 200,
      w: 75,
      h: 75,
      vy: 0,
      angle: 0,
      alpha: 1
    };

    // --- фон Москва (параллакс) ---
    const bgImg = new Image();
    bgImg.src = "moscow-bg.jpg";
    let bgOffsetX = 0;
    const BG_SPEED = 0.05; // пикс/мс

    // --- мини-фотки для стен ---
    const faceImages = [];
    for (let i = 1; i <= 6; i++) {
      const img = new Image();
      img.src = `face${i}.jpg`;
      faceImages.push(img);
    }

    // --- несколько скримеров ---
    const enemyBase = new Image();
    enemyBase.src = "enemy.png";

    const screamerImages = [enemyBase];
    ["enemy2.jpg", "enemy3.jpg", "enemy4.jpg", "enemy5.jpg"].forEach(name => {
      const img = new Image();
      img.src = name;
      screamerImages.push(img);
    });

    const screamer = {
      active: false,
      x: 0,
      y: -200,
      w: 140,
      h: 180,
      speed: 12,
      nextSpawn: 3000 + Math.random() * 3000,
      timer: 0,
      imgIndex: 0
    };

    // --- бонусы ---
    const bonuses = [];
    const bonusState = {
      type: null,
      timer: 0,
      duration: 0,
      invincible: false
    };

    // --- звуки ---
    const bgMusic = new Audio("bg-music.mp3");
    bgMusic.loop = true;
    bgMusic.volume = 0.4;

    const screamSound = new Audio("scream.mp3");
    screamSound.volume = 0.9;

    let musicStarted = false;
    function ensureMusic() {
      if (musicStarted) return;
      musicStarted = true;
      bgMusic.currentTime = 0;
      bgMusic.play().catch(() => {});
    }

    // --- игровой стейт ---
    const pipes = [];
    const particles = [];

    const deathAnim = {
      active: false,
      type: null,
      timer: 0,
      rotSpeed: 0,
      vx: 0,
      vy: 0,
      duration: 1000
    };

    let lastTime = 0;
    let pipeTimer = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem("flappyBest") || "0", 10);
    let started = false;   // false = меню
    let gameOver = false;

    // флеш-тексты по счёту
    let flashText = "";
    let flashTimer = 0;

    // --- вспомогательные функции ---
    function reset() {
      score = 0;
      player.y = 200;
      player.vy = 0;
      player.angle = 0;
      player.alpha = 1;
      pipes.length = 0;
      particles.length = 0;
      bonuses.length = 0;
      pipeTimer = 0;
      started = false;   // возвращаемся в меню
      gameOver = false;

      screamer.active = false;
      screamer.y = -screamer.h;
      screamer.timer = 0;
      screamer.nextSpawn = 3000 + Math.random() * 3000;

      deathAnim.active = false;
      deathAnim.type = null;
      deathAnim.timer = 0;

      // бонусы сбрасываем
      speedFactor = 1;
      gravityFactor = 1;
      bonusState.type = null;
      bonusState.timer = 0;
      bonusState.duration = 0;
      bonusState.invincible = false;

      flashText = "";
      flashTimer = 0;

      // музыка полностью сбрасывается, стартанёт при следующем клике
      bgMusic.pause();
      bgMusic.currentTime = 0;
      musicStarted = false;
    }

    function setGameOver() {
      if (gameOver) return;
      gameOver = true;

      // обновляем рекорд
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("flappyBest", bestScore.toString());
      }

      startDeathAnimation();

      // стопаем музыку при проигрыше
      bgMusic.pause();
      bgMusic.currentTime = 0;
      musicStarted = false;
    }

    function startDeathAnimation() {
      deathAnim.active = true;
      deathAnim.timer = 0;
      deathAnim.vx = 0;
      deathAnim.vy = 0;
      deathAnim.rotSpeed = 0;
      player.alpha = 1;

      const types = ["propeller", "flyUp", "smoke", "pixels", "ragdoll"];
      deathAnim.type = types[Math.floor(Math.random() * types.length)];

      if (deathAnim.type === "propeller") {
        player.vy = -4;
        deathAnim.rotSpeed = 0.4;
      } else if (deathAnim.type === "flyUp") {
        player.vy = -11;
        player.angle = -0.8;
      } else if (deathAnim.type === "smoke") {
        createParticles("smoke");
        deathAnim.duration = 900;
      } else if (deathAnim.type === "pixels") {
        createParticles("pixel");
        deathAnim.duration = 1000;
        player.alpha = 0;
      } else if (deathAnim.type === "ragdoll") {
        deathAnim.vx = (Math.random() * 2 - 1) * 2.5;
        deathAnim.vy = -5;
        deathAnim.rotSpeed = (Math.random() * 0.3 + 0.15) * (Math.random() < 0.5 ? -1 : 1);
      }
    }

    function createParticles(kind) {
      particles.length = 0;
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      const count = 40;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = kind === "smoke" ? Math.random() * 1.4 + 0.4 : Math.random() * 3 + 1;
        const size = kind === "smoke" ? Math.random() * 12 + 6 : Math.random() * 6 + 3;

        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (kind === "smoke" ? 0.4 : 0),
          size,
          life: 0,
          maxLife: kind === "smoke" ? 900 : 800,
          kind
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          particles.splice(i, 1);
          continue;
        }
        p.x += p.vx;
        p.y += p.vy;
        if (p.kind === "smoke") p.vy -= 0.01;
      }
    }

    function updateDeath(dt) {
      deathAnim.timer += dt;

      if (deathAnim.type === "propeller") {
        player.vy += 0.45;
        player.y += player.vy;
        player.angle += deathAnim.rotSpeed;
        if (player.y > canvas.height + 120) deathAnim.active = false;
      } else if (deathAnim.type === "flyUp") {
        player.vy += 0.38;
        player.y += player.vy;
        player.angle += 0.02;
        if (player.y < -120) deathAnim.active = false;
      } else if (deathAnim.type === "smoke" || deathAnim.type === "pixels") {
        player.alpha = Math.max(0, 1 - deathAnim.timer / deathAnim.duration);
        updateParticles(dt);
        if (deathAnim.timer >= deathAnim.duration) deathAnim.active = false;
      } else if (deathAnim.type === "ragdoll") {
        deathAnim.vy += 0.5;
        player.x += deathAnim.vx;
        player.y += deathAnim.vy;
        player.angle += deathAnim.rotSpeed;

        if (player.y + player.h > canvas.height - 45) {
          player.y = canvas.height - 45 - player.h;
          deathAnim.vy *= -0.35;
          deathAnim.rotSpeed = deathAnim.rotSpeed * 0.6;
        }
        if (Math.abs(deathAnim.vy) < 1.1 && player.y + player.h >= canvas.height - 46) {
          deathAnim.active = false;
        }
      }

      if (deathAnim.timer > 2500) {
        deathAnim.active = false;
      }
    }

    function over(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    // --- наклейки на стенах ---
    function createFaceStickers(segmentHeight) {
      const stickers = [];
      if (segmentHeight < 90 || faceImages.length === 0) return stickers;

      if (Math.random() < 0.4) return stickers;

      const count = 1 + Math.floor(Math.random() * 3);
      const margin = 8;
      const maxBaseSize = Math.min(PIPE_WIDTH * 0.8, segmentHeight * 0.8);
      const minBaseSize = Math.min(PIPE_WIDTH * 0.55, segmentHeight * 0.55);

      for (let i = 0; i < count; i++) {
        const imgIndex = Math.floor(Math.random() * faceImages.length);
        const size = minBaseSize + Math.random() * (maxBaseSize - minBaseSize);

        const maxX = PIPE_WIDTH - margin - size;
        const maxY = segmentHeight - margin - size;
        if (maxX <= margin || maxY <= margin) continue;

        const localX = margin + Math.random() * (maxX - margin);
        const localY = margin + Math.random() * (maxY - margin);
        const angle = (Math.random() - 0.5) * 0.4;

        stickers.push({ imgIndex, x: localX, y: localY, size, angle });
      }
      return stickers;
    }

    function spawnPipe() {
      const min = 60;
      const max = canvas.height - GAP - 120;
      const topH = Math.random() * (max - min) + min;
      const bottomY = topH + GAP;
      const bottomHeight = canvas.height - bottomY;

      pipes.push({
        x: canvas.width + 20,
        topH,
        bottomY,
        passed: false,
        topFaces: createFaceStickers(topH),
        bottomFaces: createFaceStickers(bottomHeight)
      });

      // шанс заспавнить бонус между трубами
      if (Math.random() < 0.35) {
        const midY = topH + GAP / 2;
        const types = ["energy", "turtle", "star"];
        const t = types[Math.floor(Math.random() * types.length)];
        bonuses.push({
          x: canvas.width + 20 + PIPE_WIDTH / 2,
          y: midY,
          r: 18,
          type: t
        });
      }
    }

    // --- фон Москва с параллаксом ---
    function drawBackground() {
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        const scale = canvas.height / bgImg.height;
        const imgW = bgImg.width * scale;
        let x = bgOffsetX % imgW;
        if (x > 0) x -= imgW;

        for (let i = 0; i < 3; i++) {
          ctx.drawImage(bgImg, x + i * imgW, 0, imgW, canvas.height);
        }
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "#bfdbfe");
        sky.addColorStop(0.5, "#93c5fd");
        sky.addColorStop(1, "#0f766e");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function drawStone(x, y, w, h) {
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#9ca3af");
      g.addColorStop(1, "#4b5563");
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
    }

    function drawFaceStickers(pipeX, baseY, faces) {
      if (!faces || faces.length === 0) return;
      for (const s of faces) {
        const img = faceImages[s.imgIndex];
        if (!img || !img.complete || img.naturalWidth === 0) continue;

        ctx.save();
        ctx.translate(pipeX + s.x + s.size / 2, baseY + s.y + s.size / 2);
        ctx.rotate(s.angle);

        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fillRect(-s.size / 2 - 2, -s.size / 2 - 2, s.size + 4, s.size + 4);

        ctx.drawImage(img, -s.size / 2, -s.size / 2, s.size, s.size);

        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.lineWidth = 2;
        ctx.strokeRect(-s.size / 2, -s.size / 2, s.size, s.size);

        ctx.restore();
      }
    }

    function drawPipes() {
      for (const p of pipes) {
        drawStone(p.x, 0, PIPE_WIDTH, p.topH);
        drawFaceStickers(p.x, 0, p.topFaces);

        const bottomHeight = canvas.height - p.bottomY;
        drawStone(p.x, p.bottomY, PIPE_WIDTH, bottomHeight);
        drawFaceStickers(p.x, p.bottomY, p.bottomFaces);
      }
    }

    function drawBonuses() {
      for (const b of bonuses) {
        ctx.save();
        let color = "#e5e7eb";
        let icon = "?";
        if (b.type === "energy") { color = "#f59e0b"; icon = "⚡"; }
        else if (b.type === "turtle") { color = "#22c55e"; icon = "🐢"; }
        else if (b.type === "star") { color = "#eab308"; icon = "★"; }

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#111827";
        ctx.fillText(icon, b.x, b.y + 1);

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const t = p.life / p.maxLife;
        const alpha = Math.max(0, 1 - t);
        ctx.globalAlpha = alpha;

        if (p.kind === "smoke") {
          const rad = p.size;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
          grad.addColorStop(0, "rgba(248,250,252,0.9)");
          grad.addColorStop(1, "rgba(148,163,184,0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = "rgba(248,250,252,0.9)";
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }

        ctx.globalAlpha = 1;
      }
    }

    function drawPlayer() {
      ctx.save();
      ctx.globalAlpha = player.alpha;
      const angle = deathAnim.active
        ? player.angle
        : Math.max(-0.35, Math.min(0.6, player.vy / 10));

      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
      ctx.rotate(angle);
      ctx.drawImage(playerImg, -player.w / 2, -player.h / 2, player.w, player.h);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawScreamer() {
      if (!screamer.active) return;

      ctx.save();
      const scale = 1 + (screamer.y / canvas.height) * 0.3;
      const cx = screamer.x + screamer.w / 2;
      const cy = screamer.y + screamer.h / 2;
      const img = screamerImages[screamer.imgIndex] || enemyBase;

      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.drawImage(img, -screamer.w / 2, -screamer.h / 2, screamer.w, screamer.h);
      ctx.restore();
    }

    function drawUI() {
      ctx.fillStyle = "#0f172a";

      // верхняя панель: счёт + рекорд
      ctx.textAlign = "left";
      ctx.font = "bold 30px system-ui";
      ctx.fillText(score, 20, 40);

      ctx.textAlign = "right";
      ctx.font = "16px system-ui";
      ctx.fillText("Рекорд: " + bestScore, canvas.width - 20, 35);

      // флэш-текст по счёту
      if (flashTimer > 0 && !gameOver) {
        ctx.textAlign = "center";
        ctx.font = "bold 20px system-ui";
        ctx.fillStyle = "#fbbf24";
        ctx.fillText(flashText, canvas.width / 2, 80);
      }

      // активный бонус
      if (bonusState.type && !gameOver) {
        const labels = {
          energy: "Энергетик: замедление",
          turtle: "Черепаха: тяжёлая гравитация",
          star:   "Звезда: неуязвимость"
        };
        const label = labels[bonusState.type];
        if (label) {
          ctx.textAlign = "center";
          ctx.font = "14px system-ui";
          ctx.fillStyle = "#e5e7eb";
          ctx.fillText(label, canvas.width / 2, 105);
        }
      }

      // меню / сообщения
      if (!started && !gameOver) {
        // главное меню
        ctx.textAlign = "center";
        ctx.font = "bold 32px system-ui";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("Flappy Roman", canvas.width / 2, canvas.height / 2 - 40);

        ctx.font = "18px system-ui";
        ctx.fillText("Рекорд: " + bestScore, canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = "16px system-ui";
        ctx.fillText("Клик / пробел — начать", canvas.width / 2, canvas.height / 2 + 20);
      }

      if (gameOver) {
        ctx.textAlign = "center";
        ctx.font = "24px system-ui";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("Игра окончена!", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "18px system-ui";
        ctx.fillText("Счёт: " + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Рекорд: " + bestScore, canvas.width / 2, canvas.height / 2 + 35);

        ctx.font = "16px system-ui";
        ctx.fillText("Клик / пробел — заново", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    // --- эффекты бонусов ---
    function applyBonus(type) {
      // сбрасываем предыдущий эффект
      speedFactor = 1;
      gravityFactor = 1;
      bonusState.invincible = false;

      bonusState.type = type;
      bonusState.timer = 0;

      if (type === "energy") {
        bonusState.duration = 5000;
        speedFactor = 0.5;
        gravityFactor = 0.7;
      } else if (type === "turtle") {
        bonusState.duration = 5000;
        gravityFactor = 1.7;
        speedFactor = 1.2;
      } else if (type === "star") {
        bonusState.duration = 3000;
        bonusState.invincible = true;
      }
    }

    // --- главный апдейт ---
    function update(dt) {
      // таймер флэш-текста
      if (flashTimer > 0) {
        flashTimer -= dt;
        if (flashTimer < 0) flashTimer = 0;
      }

      // таймер бонуса
      if (bonusState.type && bonusState.duration > 0 && !gameOver) {
        bonusState.timer += dt;
        if (bonusState.timer >= bonusState.duration) {
          // эффект закончился
          bonusState.type = null;
          bonusState.timer = 0;
          bonusState.duration = 0;
          bonusState.invincible = false;
          speedFactor = 1;
          gravityFactor = 1;
        }
      }

      if (!started) return;

      if (deathAnim.active) {
        updateDeath(dt);
        return;
      }
      if (gameOver) return;

      // фон
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        bgOffsetX -= BG_SPEED * dt * speedFactor;
      }

      // игрок
      player.vy += GRAVITY * gravityFactor;
      player.y += player.vy;

      if (player.y + player.h > canvas.height) {
        player.y = canvas.height - player.h;
        setGameOver();
      }
      if (player.y < 0) player.y = 0;

      // трубы
      pipeTimer += dt;
      if (pipeTimer > 1600) {
        spawnPipe();
        pipeTimer = 0;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 3 * speedFactor;

        if (!p.passed && p.x + PIPE_WIDTH < player.x) {
          score++;
          p.passed = true;

          // спец-тексты
          if (score === 11) {
            flashText = "Дима лох";
            flashTimer = 3000;
          } else if (score === 22) {
            flashText = "Дима всё ещё лох";
            flashTimer = 3000;
          }
        }

        if (p.x < -PIPE_WIDTH - 50) {
          pipes.splice(i, 1);
          continue;
        }

        const pb = {
          x: player.x + 10,
          y: player.y + 10,
          w: player.w - 20,
          h: player.h - 20
        };

        const top = { x: p.x, y: 0, w: PIPE_WIDTH, h: p.topH };
        const bottom = { x: p.x, y: p.bottomY, w: PIPE_WIDTH, h: canvas.height - p.bottomY };

        if (!bonusState.invincible && (over(pb, top) || over(pb, bottom))) {
          setGameOver();
        }
      }

      // бонусы: движение + коллизии
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      const pr = player.w / 3;

      for (let i = bonuses.length - 1; i >= 0; i--) {
        const b = bonuses[i];
        b.x -= 3 * speedFactor;

        if (b.x + b.r < -50) {
          bonuses.splice(i, 1);
          continue;
        }

        const dx = cx - b.x;
        const dy = cy - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < pr + b.r) {
          applyBonus(b.type);
          bonuses.splice(i, 1);
        }
      }

      // скример
      screamer.timer += dt;

      if (!screamer.active && screamer.timer >= screamer.nextSpawn) {
        screamer.active = true;
        screamer.y = -screamer.h;
        screamer.x = canvas.width / 2 - screamer.w / 2 + (Math.random() * 40 - 20);
        screamer.timer = 0;
        screamer.imgIndex = Math.floor(Math.random() * screamerImages.length);

        screamSound.currentTime = 0;
        screamSound.play().catch(() => {});
      }

      if (screamer.active) {
        screamer.y += screamer.speed * speedFactor;
        screamer.x += Math.sin(Date.now() / 60) * 0.6;

        if (screamer.y > canvas.height + screamer.h) {
          screamer.active = false;
          screamer.timer = 0;
          screamer.nextSpawn = 2500 + Math.random() * 5000;
        }
      }
    }

    // --- рендер ---
    function draw(t) {
      const dt = t - lastTime;
      lastTime = t;

      drawBackground();
      update(dt);
      drawPipes();
      drawBonuses();
      drawPlayer();
      drawScreamer();
      drawParticles();
      drawUI();

      requestAnimationFrame(draw);
    }

    // --- управление ---
    function handleInput() {
      ensureMusic();

      // главное меню → старт игры
      if (!started) {
        started = true;
        player.vy = JUMP;
        return;
      }

      // если игра окончена — сразу рестарт в меню
      if (gameOver) {
        reset();
        return;
      }

      // обычный прыжок
      player.vy = JUMP;
    }

    canvas.addEventListener("mousedown", handleInput);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        handleInput();
      }
    });

    reset();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
